name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Go-frontend/package-lock.json

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build the website
        working-directory: Go-frontend
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_APP_NAME: TrackGo
        run: |
          if [ "$VITE_BASE" = "/" ] || [ -z "$VITE_BASE" ]; then
            export VITE_BASE=/
          fi
          npm ci
          npm run build
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Go-frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
